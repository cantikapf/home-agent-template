<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 700" width="100%" height="100%">
  <defs>
    <linearGradient id="wa-header" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#075e54"/>
      <stop offset="100%" stop-color="#128c7e"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Phone Frame -->
  <rect width="540" height="700" rx="24" fill="#0b141a" stroke="#1f2c34" stroke-width="2"/>

  <!-- Top App Bar -->
  <rect width="540" height="70" rx="24" fill="url(#wa-header)"/>
  <rect y="46" width="540" height="24" fill="url(#wa-header)"/>
  
  <!-- Avatar & Name -->
  <circle cx="45" cy="35" r="18" fill="#25d366"/>
  <text x="37" y="41" font-size="18">🤖</text>
  <text x="75" y="32" font-family="-apple-system, sans-serif" font-size="15" font-weight="700" fill="#ffffff">Home Agent (Hermes)</text>
  <text x="75" y="48" font-family="-apple-system, sans-serif" font-size="11" fill="#e9edef">online • 9Router 3-Tier Brain</text>

  <!-- Chat Area Wallpaper Pattern -->
  <g opacity="0.04" stroke="#ffffff" stroke-width="1">
    <circle cx="100" cy="150" r="20"/>
    <circle cx="450" cy="300" r="30"/>
    <rect x="200" y="400" width="40" height="40" rx="5"/>
  </g>

  <!-- Message 1: User sends photo -->
  <g transform="translate(180, 95)" filter="url(#shadow)">
    <rect width="330" height="130" rx="10" fill="#005c4b"/>
    <!-- Photo thumbnail representation -->
    <rect x="10" y="10" width="310" height="85" rx="6" fill="#1f2c34"/>
    <text x="135" y="45" font-size="28">🧾</text>
    <text x="80" y="70" font-family="-apple-system, sans-serif" font-size="11" fill="#8696a0">Foto Struk Belanja Superindo</text>
    <text x="12" y="115" font-family="-apple-system, sans-serif" font-size="12" fill="#e9edef">Tolong catat struk belanja ini ya</text>
    <text x="290" y="122" font-family="-apple-system, sans-serif" font-size="9" fill="#8696a0">14:20 ✓✓</text>
  </g>

  <!-- Message 2: Bot Reply -->
  <g transform="translate(30, 245)" filter="url(#shadow)">
    <rect width="360" height="215" rx="10" fill="#202c33"/>
    <text x="16" y="28" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#25d366">🧾 Struk Belanja Berhasil Dicatat!</text>
    
    <text x="16" y="52" font-family="-apple-system, sans-serif" font-size="12" fill="#e9edef">• Minyak Goreng 2L — Rp 34.500</text>
    <text x="16" y="72" font-family="-apple-system, sans-serif" font-size="12" fill="#e9edef">• Telur Ayam 1kg — Rp 28.000</text>
    <text x="16" y="92" font-family="-apple-system, sans-serif" font-size="12" fill="#e9edef">• Bawang Merah 250g — Rp 9.500</text>

    <line x1="16" y1="108" x2="340" y2="108" stroke="#374248"/>

    <text x="16" y="128" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#ffffff">💵 Total: Rp 72.000</text>
    <text x="16" y="148" font-family="-apple-system, sans-serif" font-size="11" fill="#8696a0">📁 Kategori: Kebutuhan (Dapur)</text>
    <text x="16" y="168" font-family="-apple-system, sans-serif" font-size="11" fill="#8696a0">💳 Saldo Kas Liquid: Rp 12.378.000</text>
    <text x="16" y="188" font-family="-apple-system, sans-serif" font-size="11" fill="#38bdf8">❄️ 3 bahan otomatis ditambahkan ke Kulkas!</text>
    <text x="320" y="205" font-family="-apple-system, sans-serif" font-size="9" fill="#8696a0">14:21</text>
  </g>

  <!-- Message 3: User Recipe Link -->
  <g transform="translate(150, 480)" filter="url(#shadow)">
    <rect width="360" height="65" rx="10" fill="#005c4b"/>
    <text x="14" y="24" font-family="-apple-system, sans-serif" font-size="12" fill="#e9edef">https://vt.tiktok.com/ZSjR1... 🍳</text>
    <text x="14" y="44" font-family="-apple-system, sans-serif" font-size="12" fill="#e9edef">Simpenin resep ayam kecap pedas ini</text>
    <text x="320" y="55" font-family="-apple-system, sans-serif" font-size="9" fill="#8696a0">14:23 ✓✓</text>
  </g>

  <!-- Message 4: Bot Recipe Confirm -->
  <g transform="translate(30, 565)" filter="url(#shadow)">
    <rect width="360" height="105" rx="10" fill="#202c33"/>
    <text x="16" y="26" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#25d366">🍳 Resep Tersimpan di Database!</text>
    <text x="16" y="48" font-family="-apple-system, sans-serif" font-size="12" fill="#e9edef">📖 *Ayam Kecap Pedas Gurih*</text>
    <text x="16" y="68" font-family="-apple-system, sans-serif" font-size="11" fill="#8696a0">• 8 bahan diekstrak dari video TikTok</text>
    <text x="16" y="86" font-family="-apple-system, sans-serif" font-size="11" fill="#8696a0">• 4 langkah memasak dicatat ke Buku Resep</text>
    <text x="320" y="96" font-family="-apple-system, sans-serif" font-size="9" fill="#8696a0">14:24</text>
  </g>
</svg>
