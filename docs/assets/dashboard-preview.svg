            <circle cx="34" cy="37" r="18" fill="#27272a"/>
            <path d="M 30 28 L 30 35 M 32 28 L 32 35 M 34 28 L 34 35 M 32 35 L 32 46 M 38 28 C 40 28 40 35 38 35 L 38 46" fill="none" stroke="#fb923c" stroke-width="1.2"/>
            <text x="64" y="31" class="font-mono" font-size="13" font-weight="600" fill="#ffffff">ShopeeFood (Avocado Juice + Soursop)</text>
            <rect x="64" y="42" width="60" height="18" rx="9" fill="#27272a"/>
            <text x="74" y="55" class="font-sans" font-size="10" fill="#a1a1aa">Makanan</text>
            <text x="134" y="55" class="font-sans" font-size="11" fill="#71717a">📅 28 Agu, 21.05</text>
            <text x="568" y="42" text-anchor="end" class="font-mono" font-size="15" font-weight="700" fill="#f43f5e">-Rp 34.140</text>
