      <path d="M 6 0 L 6 1 M 6 11 L 6 12 M 0 6 L 1 6 M 11 6 L 12 6" stroke="#71717a" stroke-width="1.5"/>
      <path d="M 190 2 L 186 6 L 190 10" fill="none" stroke="#71717a" stroke-width="1.5"/>
