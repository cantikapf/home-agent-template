        <text x="18" y="32" class="font-sans" font-size="12" font-weight="600" fill="#a1a1aa">Total Pengeluaran</text>
        <text x="228" y="32" class="font-sans" font-size="11" font-weight="500" fill="#71717a">89.7% terpakai</text>
