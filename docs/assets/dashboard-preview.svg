            <text x="74" y="55" class="font-sans" font-size="10" fill="#f59e0b">Wants</text>
            <text x="134" y="55" class="font-sans" font-size="11" fill="#71717a">📅 28 Agu, 12.30</text>
            <text x="568" y="42" text-anchor="end" class="font-mono" font-size="15" font-weight="700" fill="#f43f5e">-Rp 39.000</text>
