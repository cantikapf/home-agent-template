      <rect x="9" y="14" width="16" height="12" rx="2" fill="none" stroke="#818cf8" stroke-width="1.5"/>
      <line x1="9" y1="18" x2="25" y2="18" stroke="#818cf8" stroke-width="1"/>
      
      <!-- Title -->
