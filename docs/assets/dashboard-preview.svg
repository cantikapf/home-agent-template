<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="100%" height="100%">
  <defs>
    <linearGradient id="db-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
  </defs>

  <!-- Canvas Frame -->
  <rect width="1000" height="560" rx="16" fill="url(#db-bg)" stroke="#334155" stroke-width="1.5"/>

  <!-- Browser Header bar -->
  <rect width="1000" height="40" rx="16" fill="#1e293b"/>
  <rect y="24" width="1000" height="16" fill="#1e293b"/>
  <circle cx="25" cy="20" r="5" fill="#ef4444"/>
  <circle cx="42" cy="20" r="5" fill="#f59e0b"/>
  <circle cx="59" cy="20" r="5" fill="#10b981"/>
  <rect x="250" y="8" width="500" height="24" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="440" y="24" font-family="-apple-system, sans-serif" font-size="11" fill="#94a3b8">https://homeagent.local</text>

  <!-- Sidebar -->
  <g transform="translate(0, 40)">
    <rect width="200" height="520" fill="#0b1120" stroke="#1e293b" stroke-width="1"/>
    <!-- Brand -->
    <text x="24" y="40" font-family="-apple-system, sans-serif" font-size="16" font-weight="700" fill="#f8fafc">🏡 Home Agent</text>
    <text x="24" y="58" font-family="-apple-system, sans-serif" font-size="10" fill="#64748b">UTILITY DASHBOARD</text>

    <!-- Nav Items -->
    <g transform="translate(16, 90)">
      <!-- Active Finance -->
      <rect width="168" height="34" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
      <text x="36" y="22" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#38bdf8">💰 Keuangan (Cash)</text>

      <text x="36" y="62" font-family="-apple-system, sans-serif" font-size="12" fill="#94a3b8">❄️ Stok Kulkas</text>
      <text x="36" y="102" font-family="-apple-system, sans-serif" font-size="12" fill="#94a3b8">🛒 Daftar Belanja</text>
      <text x="36" y="142" font-family="-apple-system, sans-serif" font-size="12" fill="#94a3b8">🍳 Buku Resep</text>
      <text x="36" y="182" font-family="-apple-system, sans-serif" font-size="12" fill="#94a3b8">⏰ Pengingat</text>
      <text x="36" y="222" font-family="-apple-system, sans-serif" font-size="12" fill="#94a3b8">🔀 9Router Proxy</text>
    </g>
    
    <!-- System Status Widget -->
    <g transform="translate(16, 440)">
      <rect width="168" height="54" rx="8" fill="#111827" stroke="#1f2937" stroke-width="1"/>
      <circle cx="20" cy="20" r="4" fill="#22c55e"/>
      <text x="32" y="24" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#f3f4f6">Fast Daemon Online</text>
      <text x="32" y="40" font-family="-apple-system, sans-serif" font-size="10" fill="#9ca3af">AWS EC2 • Graviton ARM64</text>
    </g>
  </g>

  <!-- Main Content Area -->
  <g transform="translate(220, 55)">
    <!-- Top Header -->
    <text x="0" y="25" font-family="-apple-system, sans-serif" font-size="20" font-weight="700" fill="#f8fafc">Dashboard Keuangan &amp; Arus Kas</text>
    <text x="0" y="45" font-family="-apple-system, sans-serif" font-size="12" fill="#64748b">Pantau aset riil liquid, rasio keinginan 50/30/20, dan pengeluaran harian</text>

    <!-- Top 3 Metric Cards -->
    <!-- Card 1: Liquid Cash -->
    <g transform="translate(0, 65)">
      <rect width="240" height="95" rx="10" fill="url(#card-grad)" stroke="#334155" stroke-width="1"/>
      <text x="16" y="26" font-family="-apple-system, sans-serif" font-size="11" fill="#94a3b8" font-weight="600">SALDO KAS TERSEDIA (LIQUID)</text>
      <text x="16" y="58" font-family="-apple-system, sans-serif" font-size="22" fill="#38bdf8" font-weight="800">Rp 12.450.000</text>
      <text x="16" y="80" font-family="-apple-system, sans-serif" font-size="10" fill="#10b981">● 3 Rekening Kas Terkoneksi</text>
    </g>

    <!-- Card 2: Total Expenses -->
    <g transform="translate(255, 65)">
      <rect width="240" height="95" rx="10" fill="url(#card-grad)" stroke="#334155" stroke-width="1"/>
      <text x="16" y="26" font-family="-apple-system, sans-serif" font-size="11" fill="#94a3b8" font-weight="600">PENGELUARAN BULAN INI</text>
      <text x="16" y="58" font-family="-apple-system, sans-serif" font-size="22" fill="#f43f5e" font-weight="800">Rp 3.125.000</text>
      <text x="16" y="80" font-family="-apple-system, sans-serif" font-size="10" fill="#64748b">28 Transaksi tercatat</text>
    </g>

    <!-- Card 3: Wants 50/30/20 Ratio -->
    <g transform="translate(510, 65)">
      <rect width="245" height="95" rx="10" fill="url(#card-grad)" stroke="#334155" stroke-width="1"/>
      <text x="16" y="26" font-family="-apple-system, sans-serif" font-size="11" fill="#94a3b8" font-weight="600">RASIO WANTS (MAKS 30%)</text>
      <text x="16" y="58" font-family="-apple-system, sans-serif" font-size="22" fill="#10b981" font-weight="800">22.4% <tspan font-size="12" fill="#94a3b8">(Sehat)</tspan></text>
      <!-- Progress Bar -->
      <rect x="16" y="70" width="210" height="6" rx="3" fill="#334155"/>
      <rect x="16" y="70" width="95" height="6" rx="3" fill="#10b981"/>
    </g>

    <!-- Bottom Section: Transactions Table Mockup -->
    <g transform="translate(0, 180)">
      <rect width="495" height="300" rx="10" fill="url(#card-grad)" stroke="#334155" stroke-width="1"/>
      <text x="20" y="30" font-family="-apple-system, sans-serif" font-size="14" font-weight="600" fill="#f8fafc">Mutasi Pengeluaran Terbaru</text>

      <!-- Row 1 -->
      <g transform="translate(20, 50)">
        <circle cx="15" cy="15" r="14" fill="#334155"/>
        <text x="8" y="20" font-size="14">🛒</text>
        <text x="40" y="14" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#f1f5f9">Belanja Mingguan Sayur &amp; Daging</text>
        <text x="40" y="28" font-family="-apple-system, sans-serif" font-size="10" fill="#64748b">Kebutuhan • Supermarket</text>
        <text x="400" y="20" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#f43f5e">-Rp 185.000</text>
      </g>
      <line x1="20" y1="90" x2="475" y2="90" stroke="#1e293b"/>

      <!-- Row 2 -->
      <g transform="translate(20, 100)">
        <circle cx="15" cy="15" r="14" fill="#334155"/>
        <text x="8" y="20" font-size="14">☕</text>
        <text x="40" y="14" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#f1f5f9">Kopi &amp; Pastry Kafe</text>
        <text x="40" y="28" font-family="-apple-system, sans-serif" font-size="10" fill="#f59e0b">Keinginan (Wants) • Gaya Hidup</text>
        <text x="400" y="20" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#f43f5e">-Rp 45.000</text>
      </g>
      <line x1="20" y1="140" x2="475" y2="140" stroke="#1e293b"/>

      <!-- Row 3 -->
      <g transform="translate(20, 150)">
        <circle cx="15" cy="15" r="14" fill="#334155"/>
        <text x="8" y="20" font-size="14">🧾</text>
        <text x="40" y="14" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#f1f5f9">Tagihan Internet &amp; Wifi</text>
        <text x="40" y="28" font-family="-apple-system, sans-serif" font-size="10" fill="#64748b">Tagihan (Bills) • Bulanan</text>
        <text x="400" y="20" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#f43f5e">-Rp 385.000</text>
      </g>
      <line x1="20" y1="190" x2="475" y2="190" stroke="#1e293b"/>

      <!-- Row 4 -->
      <g transform="translate(20, 200)">
        <circle cx="15" cy="15" r="14" fill="#334155"/>
        <text x="8" y="20" font-size="14">🍳</text>
        <text x="40" y="14" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#f1f5f9">Minyak Goreng &amp; Telur (Receipt OCR)</text>
        <text x="40" y="28" font-family="-apple-system, sans-serif" font-size="10" fill="#64748b">Kebutuhan • Vision Auto-Log</text>
        <text x="400" y="20" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#f43f5e">-Rp 62.000</text>
      </g>
    </g>

    <!-- Bottom Right Section: Quick Inventory Widget -->
    <g transform="translate(510, 180)">
      <rect width="245" height="300" rx="10" fill="url(#card-grad)" stroke="#334155" stroke-width="1"/>
      <text x="16" y="30" font-family="-apple-system, sans-serif" font-size="14" font-weight="600" fill="#f8fafc">Status Kulkas &amp; Dapur</text>
      
      <g transform="translate(16, 50)">
        <rect width="213" height="48" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
        <text x="12" y="22" font-family="-apple-system, sans-serif" font-size="12" fill="#f8fafc" font-weight="600">Telur Ayam</text>
        <text x="12" y="38" font-family="-apple-system, sans-serif" font-size="10" fill="#10b981">10 butir tersisa</text>
      </g>

      <g transform="translate(16, 110)">
        <rect width="213" height="48" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
        <text x="12" y="22" font-family="-apple-system, sans-serif" font-size="12" fill="#f8fafc" font-weight="600">Susu UHT Full Cream</text>
        <text x="12" y="38" font-family="-apple-system, sans-serif" font-size="10" fill="#f59e0b">Sisa 1 liter (Hampir Habis)</text>
      </g>

      <g transform="translate(16, 170)">
        <rect width="213" height="48" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
        <text x="12" y="22" font-family="-apple-system, sans-serif" font-size="12" fill="#f8fafc" font-weight="600">Bawang Merah &amp; Putih</text>
        <text x="12" y="38" font-family="-apple-system, sans-serif" font-size="10" fill="#10b981">500 gram (Stok Aman)</text>
      </g>

      <g transform="translate(16, 230)">
        <rect width="213" height="50" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
        <text x="12" y="22" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#38bdf8">🛒 3 Item Belanjaan Pending</text>
        <text x="12" y="38" font-family="-apple-system, sans-serif" font-size="10" fill="#94a3b8">Bumbu Dapur, Kopi Beans, Keju</text>
      </g>
    </g>
  </g>
</svg>
