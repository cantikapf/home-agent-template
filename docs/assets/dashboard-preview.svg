    <!-- Nav Section 3: CONFIGURATION -->
    <g transform="translate(18, 400)">
      <text x="0" y="0" class="font-sans" font-size="9" font-weight="700" fill="#52525b" letter-spacing="1.2">CONFIGURATION</text>

      <!-- Env Variables -->
      <g transform="translate(0, 16)">
        <circle cx="5" cy="5" r="4" fill="none" stroke="#71717a" stroke-width="1.5"/>
        <path d="M 8 7 L 13 12 M 11 10 L 13 8" stroke="#71717a" stroke-width="1.5"/>
        <text x="22" y="11" class="font-mono" font-size="12" fill="#a1a1aa">Env Variables</text>
      </g>

      <!-- Agent Rules -->
      <g transform="translate(0, 46)">
        <rect x="1" y="2" width="11" height="9" rx="2" fill="none" stroke="#71717a" stroke-width="1.5"/>
        <circle cx="4.5" cy="5.5" r="1" fill="#71717a"/>
        <circle cx="8.5" cy="5.5" r="1" fill="#71717a"/>
        <text x="22" y="11" class="font-mono" font-size="12" fill="#a1a1aa">Agent Rules</text>
