            <circle cx="34" cy="37" r="18" fill="#27272a"/>
            <rect x="28" y="31" width="12" height="13" rx="2" fill="none" stroke="#a78bfa" stroke-width="1.2"/>
            <path d="M 31 31 C 31 28 37 28 37 31" fill="none" stroke="#a78bfa" stroke-width="1.2"/>
            <text x="64" y="31" class="font-mono" font-size="13" font-weight="600" fill="#ffffff">Belanja Supermarket Dapur (14 item)</text>
            <rect x="64" y="42" width="55" height="18" rx="9" fill="#27272a"/>
            <text x="74" y="55" class="font-sans" font-size="10" fill="#a1a1aa">Belanja</text>
            <text x="128" y="55" class="font-sans" font-size="11" fill="#71717a">📅 28 Agu, 19.51</text>
            <text x="568" y="42" text-anchor="end" class="font-mono" font-size="15" font-weight="700" fill="#f43f5e">-Rp 185.443</text>
