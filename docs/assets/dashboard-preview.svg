<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="100%" height="100%">
  <defs>
    <style>
      .font-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; }
      .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    </style>
  </defs>

  <!-- Dark Background -->
  <rect width="1280" height="720" fill="#0c0c0e"/>

  <!-- SIDEBAR (w = 230, h = 720) -->
  <g id="sidebar">
    <rect width="230" height="720" fill="#09090b" stroke="#1f1f23" stroke-width="1"/>

    <!-- Brand Header -->
    <g transform="translate(18, 20)">
      <!-- Logo Box -->
      <rect width="34" height="34" rx="4" fill="#ffffff"/>
      <!-- Lightning Bolt (Zap) Icon -->
      <path d="M 19 6 L 10 18 L 17 18 L 15 28 L 24 16 L 17 16 Z" fill="#000000"/>
      <!-- Brand Text -->
      <text x="44" y="18" class="font-sans" font-size="15" font-weight="700" fill="#ffffff">Hermes</text>
      <text x="44" y="30" class="font-sans" font-size="8" font-weight="600" fill="#71717a" letter-spacing="1">ADMIN DASHBOARD</text>
      <!-- Version Pill -->
      <rect x="155" y="10" width="34" height="16" rx="2" fill="#18181b" stroke="#27272a" stroke-width="1"/>
      <text x="162" y="21" class="font-mono" font-size="9" fill="#a1a1aa">v0.1</text>
    </g>

    <!-- Divider -->
    <line x1="0" y1="72" x2="230" y2="72" stroke="#1f1f23" stroke-width="1"/>

    <!-- Nav Section 1: MONITORING & SYSTEM -->
    <g transform="translate(18, 95)">
      <text x="0" y="0" class="font-sans" font-size="9" font-weight="700" fill="#52525b" letter-spacing="1.2">MONITORING &amp; SYSTEM</text>
      
      <!-- System Overview -->
      <g transform="translate(0, 14)">
        <rect x="0" y="0" width="12" height="12" rx="1" fill="none" stroke="#71717a" stroke-width="1.5"/>
        <rect x="3" y="3" width="2" height="2" fill="#71717a"/>
        <rect x="7" y="3" width="2" height="2" fill="#71717a"/>
        <rect x="3" y="7" width="2" height="2" fill="#71717a"/>
        <rect x="7" y="7" width="2" height="2" fill="#71717a"/>
        <text x="22" y="10" class="font-mono" font-size="12" fill="#a1a1aa">System Overview</text>
      </g>
      
      <!-- Live Logs -->
      <g transform="translate(0, 42)">
        <path d="M 2 0 L 8 0 L 12 4 L 12 14 L 2 14 Z" fill="none" stroke="#71717a" stroke-width="1.5"/>
        <text x="22" y="11" class="font-mono" font-size="12" fill="#a1a1aa">Live Logs</text>
      </g>

      <!-- Audit Log -->
      <g transform="translate(0, 70)">
        <path d="M 2 2 L 6 0 L 10 2 L 10 7 C 10 10 6 12 6 12 C 6 12 2 10 2 7 Z" fill="none" stroke="#71717a" stroke-width="1.5"/>
        <text x="22" y="10" class="font-mono" font-size="12" fill="#a1a1aa">Audit Log</text>
      </g>
    </g>

    <!-- Nav Section 2: HOME & FINANCE -->
    <g transform="translate(18, 220)">
      <text x="0" y="0" class="font-sans" font-size="9" font-weight="700" fill="#52525b" letter-spacing="1.2">HOME &amp; FINANCE</text>
      
      <!-- Keuangan (ACTIVE) -->
      <g transform="translate(-8, 12)">
        <rect width="210" height="34" rx="4" fill="#18181b" stroke="#27272a" stroke-width="1"/>
        <rect x="12" y="9" width="16" height="12" rx="2" fill="none" stroke="#38bdf8" stroke-width="1.5"/>
        <line x1="12" y1="13" x2="28" y2="13" stroke="#38bdf8" stroke-width="1"/>
        <text x="36" y="21" class="font-mono" font-size="12" font-weight="600" fill="#38bdf8">Keuangan</text>
      </g>

      <!-- Daftar Belanja -->
      <g transform="translate(0, 62)">
        <rect x="0" y="2" width="12" height="10" rx="1" fill="none" stroke="#71717a" stroke-width="1.5"/>
        <line x1="4" y1="5" x2="8" y2="5" stroke="#71717a" stroke-width="1"/>
        <line x1="4" y1="8" x2="8" y2="8" stroke="#71717a" stroke-width="1"/>
        <text x="22" y="11" class="font-mono" font-size="12" fill="#a1a1aa">Daftar Belanja</text>
      </g>

      <!-- Stok Kulkas -->
      <g transform="translate(0, 92)">
        <ellipse cx="6" cy="3" rx="6" ry="2.5" fill="none" stroke="#71717a" stroke-width="1.2"/>
        <path d="M 0 3 L 0 11 C 0 13 12 13 12 11 L 12 3" fill="none" stroke="#71717a" stroke-width="1.2"/>
        <text x="22" y="10" class="font-mono" font-size="12" fill="#a1a1aa">Stok Kulkas</text>
      </g>

      <!-- Buku Resep -->
      <g transform="translate(0, 122)">
        <path d="M 1 2 C 3 1 6 1 6 3 L 6 13 C 6 11 3 11 1 12 Z M 11 2 C 9 1 6 1 6 3 L 6 13 C 6 11 9 11 11 12 Z" fill="none" stroke="#71717a" stroke-width="1.2"/>
        <text x="22" y="10" class="font-mono" font-size="12" fill="#a1a1aa">Buku Resep</text>
